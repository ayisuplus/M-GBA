[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "m-gba"
version = "0.2.0"
description = "A bottom-up cross-scale digital-life architecture research prototype"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
dev = ["coverage>=7.0"]

[project.scripts]
mgba = "mgba.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
[tool.coverage.run]
source = ["src/mgba"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = ["if __name__ == .__main__.:"]
