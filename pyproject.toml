[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "m-gba"
version = "0.1.0"
description = "A bottom-up cross-scale digital-life architecture research prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mgba = "mgba.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
