name: Core CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'configs/**'
      - 'scripts/**'
      - 'data/registry.json'
      - 'pyproject.toml'
      - '.github/workflows/core-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'configs/**'
      - 'scripts/**'
      - 'data/registry.json'
      - 'pyproject.toml'
      - '.github/workflows/core-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests, coverage gate, CLI smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install package with dev extras
        run: python -m pip install -e .[dev]

      - name: Run unit tests
        run: python -B -m unittest discover -s tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'

      - name: Coverage gate
        run: |
          python -B -m coverage run -m unittest discover -s tests
          python -B -m coverage report --fail-under=80

      - name: CLI gate — multiscale demo
        run: mgba run --config configs/multiscale_demo.json

      - name: CLI gate — sten smoke
        run: mgba sten-smoke --config configs/demo.json

      - name: CLI gate — data registry check
        run: mgba data-check
